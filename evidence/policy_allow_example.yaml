# Throwaway policy for the ALLOW-path inspection (plan step 2c).
# It is the deny-all policy plus one inspected endpoint: the Python
# interpreter may send read-only HTTPS requests to example.com, and nothing else.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log, /opt, /workspace]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  example_read_only:
    endpoints:
      - host: example.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/local/bin/python3.12
